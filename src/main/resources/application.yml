info:
  app:
    name: refund-analysis-agent-demo
    env: ${APP_ENV:local}

openai:
  base-url: https://api.302.ai
  api-key: ${OPENAI_API_KEY}
  model: gpt-5-mini

agent:
  limits:
    globalMaxConcurrent: 10
    perStoreMaxConcurrent: 2
    storeIdleTtlMinutes: 30
    maxStores: 10000
  timeouts:
    toolSeconds: 10       # 单个 tool 最长
    llmIdleSeconds: 15    # LLM 15s 没新 token 判定卡死
    llmMaxSeconds: 60     # LLM 最长总时长, 防无限输出
    runSeconds: 180       # 整条链路兜底
  result-store:
    dir: "E:/projects/RefundAnalysisAgentDemo/data/results"

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,resultStoreHealth,openaiConfigHealth,concurrencyLimiterHealth
        liveness:
          include: livenessState
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: simple

ops:
  user: ${OPS_USER:ops}
  password: ${OPS_PASSWORD:change-me}

logging:
  level:
    reactor.netty.channel.FluxReceive: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId} resultId=%X{resultId} storeId=%X{storeId} windowDays=%X{windowDays} %logger{36} - %msg%n"