openai:
  base-url: https://api.302.ai
  api-key: ${OPENAI_API_KEY}
  model: gpt-5-mini

logging:
  level:
    reactor.netty.channel.FluxReceive: ERROR

agent:
  limits:
    globalMaxConcurrent: 10
    perStoreMaxConcurrent: 2
    storeIdleTtlMinutes: 30
    maxStores: 10000
  timeouts:

    toolSeconds: 10       # 单个 tool 最长
    llmIdleSeconds: 15    # LLM 15s 没新 token 判定卡死
    llmMaxSeconds: 60     # LLM 最长总时长, 防无限输出
    runSeconds: 180       # 整条链路兜底
